<div class="exe-text-template">
    <p style="text-align: center;"><em><strong>Little Monsters,</strong></em></p>
<p style="text-align: center;">Ahora sí que sí ya nos vamos a poner manos a la obra después de tanta teoría y tanto leer...</p>
<p style="text-align: center;">En la línea temporal habéis podido ver, qué vamos a hacer. Pero solo de un vistazo. Ahora en la pestaña "sesiones" vais a poder ver qué vamos a hacer, en la hora de qué asignatura y los pasos que tenemos que seguir. </p>
<p style="text-align: center;">AHORA SÍ QUE SÍ. ¡¡ARRANCAMOS MOTORES!!</p>
